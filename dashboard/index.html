<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>总览 · Argus Guardian</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="overview">
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="workspace">
      <section class="metric-grid" aria-label="核心指标">
        <article class="metric-card danger">
          <span class="metric-label" id="detectedLabel">攻击检出</span>
          <strong id="detectedMetric">--</strong>
          <small id="recallMetric">recall --</small>
        </article>
        <article class="metric-card warn">
          <span class="metric-label">告警样本</span>
          <strong id="flagMetric">--</strong>
          <small>FLAG but not blocked</small>
        </article>
        <article class="metric-card safe">
          <span class="metric-label">阻断样本</span>
          <strong id="blockMetric">--</strong>
          <small>BLOCK decisions</small>
        </article>
        <article class="metric-card info">
          <span class="metric-label">平均延时</span>
          <strong id="latencyMetric">--</strong>
          <small id="latencyScope">local evaluation</small>
        </article>
      </section>

      <section class="panel page-intro">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Workspace guide</p>
            <h3>从总览进入不同工作页面</h3>
          </div>
        </div>
        <p class="page-intro-copy">每个模块都有独立地址；切换导航时会打开对应页面，而不是在长页面中跳转。</p>
        <div class="page-link-grid">
          <a class="page-link-card" href="/attack-lab.html"><strong>攻击面实验台</strong><span>重跑七类攻击面，或启动 DeepSeek 红队。</span></a>
          <a class="page-link-card" href="/samples.html"><strong>红队样本</strong><span>筛选离线样本并查看 Guardian 判定。</span></a>
          <a class="page-link-card" href="/defense.html"><strong>防御层</strong><span>分析四层防御状态与攻击覆盖。</span></a>
          <a class="page-link-card" href="/rules.html"><strong>规则管理</strong><span>启用、停用或撤销自适应规则。</span></a>
          <a class="page-link-card" href="/evaluation.html"><strong>演示与评估</strong><span>运行验收演示或提交自定义调用。</span></a>
          <a class="page-link-card" href="/audit.html"><strong>审计流</strong><span>查看并清理持久化审计历史。</span></a>
        </div>
      </section>
    </main>
  </div>
  <script src="/shell.js"></script>
  <script src="/app.js"></script>
</body>
</html>
